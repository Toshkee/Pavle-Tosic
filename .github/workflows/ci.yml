name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Serve the production build and assert the things that used to rot
      # silently: routes, canonicals, JSON-LD, security headers, dead links.
      - name: Start the production server
        run: |
          npm start &
          npx --yes wait-on http://localhost:3000 --timeout 60000
      - run: npm run check:site

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the production server
        run: |
          npm start &
          npx --yes wait-on http://localhost:3000 --timeout 60000
          # Don't let the first trace pay for a cold server.
          curl -sf http://localhost:3000 -o /dev/null
          curl -sf http://localhost:3000 -o /dev/null

      # A regression tripwire, not a score chase. Three runs because a single
      # one is noise: see the header of scripts/lighthouse-budget.mjs.
      - name: Run Lighthouse
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@12 http://localhost:3000 \
              --output=json --output-path=./lh-$i.json --quiet \
              --chrome-flags="--headless=new --no-sandbox"
          done
      - name: Assert the budget
        run: node scripts/lighthouse-budget.mjs lh-1.json lh-2.json lh-3.json

      # Keep the raw reports so a future failure is diagnosable from the run
      # itself, without rebuilding and re-running Lighthouse locally.
      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lh-*.json
