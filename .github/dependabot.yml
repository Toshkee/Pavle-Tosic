version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for all safe npm updates instead of one PR per package.
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Node types must track the runtime (engines: >=22, Workers on Node 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors are breaking; upgrade deliberately, not automatically.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # React/Next majors are framework migrations, not dependency bumps.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Action SHA re-pins are noisy and always safe to batch.
      actions-all:
        patterns:
          - "*"
